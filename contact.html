
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Surge Attorneys</title>
<meta name="description" content="Contact Surge Attorneys for a free, confidential case review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<div class="page-hero"><div class="wrap"><h1>Contact Us</h1><p>Tell us about your situation. We respond within 24 hours.</p></div></div>
<section><div class="wrap split">
<form id="contact-form" novalidate>
<label for="name">Full Name</label><input id="name" name="name" type="text">
<label for="email">Email</label><input id="email" name="email" type="email">
<label for="phone">Phone</label><input id="phone" name="phone" type="tel">
<label for="area">Area of Law</label><select id="area" name="area"><option>Personal Injury</option><option>Corporate Law</option><option>Family Law</option><option>Criminal Defense</option><option>Real Estate</option><option>Employment Law</option><option>Immigration (Study Visa)</option><option>Immigration (Relocation)</option><option>Other</option></select>
<label for="message">How can we help?</label><textarea id="message" name="message" rows="6"></textarea>
<button class="btn" type="submit">Request Free Consultation</button>
<div id="form-msg" class="msg"></div>
</form>
<div class="info card">
<h3 style="margin-bottom:20px">Office Details</h3>
<p><b>Address</b>48 Diya Street Ifako Gbagada, Lagos State</p>
<p><b>Phone</b>+234 803 358 2591</p>
<p><b>Email</b>Surgeattorneys@gmail.com</p>
<p><b>Hours</b>Mon – Fri, 8:00am – 6:00pm</p>
<p style="font-size:.82rem">Sending a message does not create an attorney-client relationship.</p>
</div></div></section>

<div id="site-footer"></div>
<script src="script.js"></script>
</body>
</html>
